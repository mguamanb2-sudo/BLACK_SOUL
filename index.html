<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK SOUL | Inicio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0b !important;
      color: #ffffff !important;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* MENÚ SUPERIOR CENTRADO */
    header {
      background-color: rgba(0, 0, 0, 0.95);
      padding: 15px 7%;
      border-bottom: 2px solid #e50914;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #cccccc !important;
      text-decoration: none !important;
      font-weight: bold !important;
      font-size: 15px !important;
      letter-spacing: 1px !important;
      padding: 8px 18px !important;
      border-radius: 4px !important;
      transition: all 0.3s ease !important;
    }

    /* Efecto al pasar el mouse */
    nav a:hover {
      color: #ffffff !important;
      background-color: rgba(229, 9, 20, 0.25) !important;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    /* Botón activo (Página actual) */
    nav a.active {
      color: #ffffff !important;
      background-color: #e50914 !important;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.7);
    }

    /* BANNER PRINCIPAL */
    .contenido {
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.75)), url('banner.jpg');
      background-size: cover;
      background-position: center top 20px; 
      background-repeat: no-repeat;
      min-height: 100vh;
      padding: 180px 8% 60px 8%; 
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .contenido h2 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #e50914;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      letter-spacing: 2px;
    }

    .contenido p {
      margin-bottom: 12px;
      line-height: 1.6;
      font-size: 18px;
      color: #dddddd;
      max-width: 600px;
    }

    .boton {
      display: inline-block;
      background-color: #e50914;
      color: #ffffff;
      padding: 12px 28px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .boton:hover {
      background-color: #b20710;
      transform: scale(1.05);
    }

    footer {
      background-color: #000000 !important;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #666666 !important;
      border-top: 1px solid #141414;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="contactame.html">Contactos</a>
    </nav>
  </header>

  <main class="contenido">
    <h2>VISTE TU ACTITUD</h2>
    <p>Bienvenido a BLACK SOUL, tu tienda de ropa rockera.</p>
    <p>Encuentra camisetas, chaquetas y prendas para expresar tu pasión por el rock.</p>
    <a href="catalogo.html" class="boton">VER PRODUCTOS DESTACADOS</a>
  </main>

  <footer>
    <p>© 2026 BLACK SOUL | La música se lleva puesta.</p>
  </footer>

</body>
</html>
