<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK SOUL - Panel Admin</title>
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #e50914; }
        h2 { color: #e50914; text-align: center; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #e50914; color: #fff; padding: 12px; border: none; margin-top: 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background: #b20710; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; font-size: 16px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Panel Admin - BLACK SOUL</h2>
        <form id="productForm">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" required>

            <label for="categoria">Categoría:</label>
            <select id="categoria">
                <option value="Chaquetas">Chaquetas</option>
                <option value="Camisetas">Camisetas</option>
                <option value="Calzado">Calzado</option>
                <option value="Accesorios">Accesorios</option>
            </select>

            <label for="precio">Precio ($):</label>
            <input type="number" step="0.01" id="precio" required>

            <label for="imagen">Imagen del Producto:</label>
            <input type="file" id="imagen" accept="image/*" required>

            <button type="button" id="btnGuardar">Subir Producto</button>
        </form>
        <p id="mensaje"></p>
    </div>

    <!-- Firebase Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu proyecto Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyAD7sweEf1vOgG79WB-CqXJKF_iMgwz8Ag",
          authDomain: "blacksoul82.firebaseapp.com",
          projectId: "blacksoul82",
          storageBucket: "blacksoul82.firebasestorage.app",
          messagingSenderId: "918527095913",
          appId: "1:918527095913:web:0bd30e974e9bbc6e8e5ef8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tu clave API de ImgBB
        const IMGBB_API_KEY = "132aceb58e574375de38fe57b54806c8";

        const btnGuardar = document.getElementById("btnGuardar");
        const mensaje = document.getElementById("mensaje");

        btnGuardar.addEventListener("click", async () => {
            const nombre = document.getElementById("nombre").value.trim();
            const categoria = document.getElementById("categoria").value;
            const precioVal = document.getElementById("precio").value;
            const imagenInput = document.getElementById("imagen");

            if (!nombre || !precioVal || imagenInput.files.length === 0) {
                mensaje.style.color = "#e50914";
                mensaje.textContent = "Por favor, completa todos los campos y selecciona una imagen.";
                return;
            }

            const precio = parseFloat(precioVal);
            const imagenFile = imagenInput.files[0];

            mensaje.style.color = "#ffff00";
            mensaje.textContent = "⏳ Subiendo imagen desde la PC...";

            try {
                // 1. Enviar la imagen a ImgBB
                const formData = new FormData();
                formData.append("image", imagenFile);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error("Error en ImgBB");
                }

                const imagenUrl = data.data.url;
                mensaje.textContent = "⏳ Guardando producto en Firebase...";

                // 2. Guardar los datos en Firestore
                await addDoc(collection(db, "productos"), {
                    nombre: nombre,
                    categoria: categoria,
                    precio: precio,
                    imagen: imagenUrl,
                    fecha: new Date()
                });

                mensaje.style.color = "#00ff00";
                mensaje.textContent = "✅ ¡Producto y foto subidos con éxito!";
                document.getElementById("productForm").reset();

            } catch (error) {
                console.error("Error completo:", error);
                mensaje.style.color = "#e50914";
                mensaje.textContent = "❌ Error al subir: Revisa la consola (F12).";
            }
        });
    </script>
</body>
</html>
