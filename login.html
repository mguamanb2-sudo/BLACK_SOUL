<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK SOUL | Iniciar Sesión</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: linear-gradient(rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.92)), url('banner.jpg') !important;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff !important;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(0, 0, 0, 0.95);
      padding: 15px 7%;
      border-bottom: 2px solid #e50914;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #cccccc !important;
      text-decoration: none !important;
      font-weight: bold !important;
      font-size: 15px !important;
      letter-spacing: 1px !important;
      padding: 8px 18px !important;
      border-radius: 4px !important;
      transition: all 0.3s ease !important;
    }

    nav a:hover {
      color: #ffffff !important;
      background-color: rgba(229, 9, 20, 0.25) !important;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    nav a.active {
      color: #ffffff !important;
      background-color: #e50914 !important;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.7);
    }

    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 130px 20px 60px 20px;
    }

    .login-box {
      background-color: rgba(26, 26, 26, 0.92);
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      text-align: center;
    }

    .login-box h2 {
      color: #e50914;
      font-size: 30px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .login-box p {
      color: #aaaaaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #dddddd;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0b0b0b;
      border: 1px solid #444444;
      border-radius: 4px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: #e50914;
    }

    .boton-submit {
      width: 100%;
      background-color: #e50914;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    .boton-submit:hover {
      background-color: #b20710;
    }

    footer {
      background-color: #000000 !important;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #666666 !important;
      border-top: 1px solid #141414;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="login.html" class="active">Iniciar sesión</a>
      <a href="contactame.html">Contactos</a>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-box">
      <h2>INICIAR SESIÓN</h2>
      <p>Ingresa tus datos para acceder a tu cuenta.</p>

      <form>
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
        </div>

        <button type="submit" class="boton-submit">INGRESAR</button>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 BLACK SOUL | La música se lleva puesta.</p>
  </footer>

</body>
</html>
