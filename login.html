<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK SOUL - Iniciar Sesión / Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('fondo-rock.jpg');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            background-color: #161616;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .login-container h2 {
            text-align: center;
            color: #ff1e1e;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-container p {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #ff1e1e;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff1e1e;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #d01515;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .toggle-link a {
            color: #ff1e1e;
            text-decoration: none;
            font-weight: bold;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        #error-message {
            color: #ff4d4d;
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 id="form-title">Iniciar Sesión</h2>
        <p id="form-subtitle">Ingresa tus datos para acceder a tu cuenta.</p>

        <div id="error-message"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Ingresar</button>
        </form>

        <div class="toggle-link">
            <span id="toggle-text">¿No tienes cuenta?</span> 
            <a href="#" id="toggle-btn">Regístrate aquí</a>
        </div>
    </div>

    <!-- Script de Firebase y lógica de autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Configuración real con tus credenciales de Firebase (blacksoul82 / BlackSoulWeb)
        const firebaseConfig = {
            apiKey: "AIzaSyAD7sweEf1vOgG79WB-CqXJKF_iMgwz8Ag",
            authDomain: "blacksoul82.firebaseapp.com",
            projectId: "blacksoul82",
            storageBucket: "blacksoul82.firebasestorage.app",
            messagingSenderId: "918527095913",
            appId: "1:918527095913:web:0bd30e974e9bbc6e8e5ef8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegistering = false;

        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const authForm = document.getElementById('auth-form');
        const errorMessage = document.getElementById('error-message');

        // Cambiar entre Iniciar Sesión y Registro
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isRegistering = !isRegistering;
            errorMessage.textContent = "";

            if (isRegistering) {
                formTitle.textContent = "Registro";
                formSubtitle.textContent = "Crea una nueva cuenta en BLACK SOUL.";
                submitBtn.textContent = "Registrarse";
                toggleText.textContent = "¿Ya tienes cuenta?";
                toggleBtn.textContent = "Inicia sesión aquí";
            } else {
                formTitle.textContent = "Iniciar Sesión";
                formSubtitle.textContent = "Ingresa tus datos para acceder a tu cuenta.";
                submitBtn.textContent = "Ingresar";
                toggleText.textContent = "¿No tienes cuenta?";
                toggleBtn.textContent = "Regístrate aquí";
            }
        });

        // Manejar el envío del formulario
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorMessage.textContent = "";

            try {
                if (isRegistering) {
                    // Registro de usuario
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("¡Cuenta creada con éxito!");
                    window.location.href = "catalogo.html";
                } else {
                    // Inicio de sesión
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("¡Bienvenido de nuevo a BLACK SOUL!");
                    window.location.href = "catalogo.html";
                }
            } catch (error) {
                console.error(error.code);
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage.textContent = "Este correo ya está registrado.";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    errorMessage.textContent = "Correo o contraseña incorrectos.";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage.textContent = "La contraseña debe tener al menos 6 caracteres.";
                } else {
                    errorMessage.textContent = "Ocurrió un error: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
